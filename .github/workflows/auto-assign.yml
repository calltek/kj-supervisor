# Este repo es PÚBLICO y admite forks, así que aquí NO se usa `CI_RUNNER`, igual
# que en `build.yml`. `CI_RUNNER` es una variable de ORGANIZACIÓN: el día que se
# defina —afecta a los cuatro repos a la vez— este job pasaría a correr en
# nuestra máquina disparado por el PR de cualquiera de internet, sin que nadie
# toque un YAML ni abra un PR. Y `pull_request_target` lo dispara el de fuera.
#
# Sin `checkout` no hay ejecución de código ajeno, pero el `GITHUB_TOKEN` con
# permiso de escritura acabaría en un runner propio, no efímero y compartido
# por toda la org, y encolar trabajo en esa máquina quedaría al alcance de
# cualquiera. Sobre todo: el siguiente workflow que se copie de éste heredaría
# el `runs-on`, y ese sí puede llevar un `checkout`.
#
# En los tres repos privados —kj-app, kj-backend, kj-agent-base— el fichero sí
# lleva `vars.CI_RUNNER`. Es la única línea en la que divergen.
# Asigna a 50l3r como *assignee* de todo PR nuevo, para tenerlos localizados
# en `assignee:@me`. Es a proposito distinto de CODEOWNERS: ese fichero solo
# SOLICITA REVIEW (Nova y SOKI), que es otro rol.
name: auto-assign

on:
    pull_request_target:
        types: [opened, reopened]

# El job no hace checkout: solo llama a la API, asi que `pull_request_target`
# no llega a ejecutar nada del codigo de la rama del PR.
permissions:
    pull-requests: write

jobs:
    assign:
        runs-on: ubuntu-latest
        steps:
            - name: asignar a 50l3r
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  PR: ${{ github.event.pull_request.number }}
              run: |
                  gh api -X POST "repos/$REPO/issues/$PR/assignees" \
                    -f "assignees[]=50l3r"
