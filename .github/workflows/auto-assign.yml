# Dónde corre esto lo decide la variable `CI_RUNNER` de la organización:
#
#   sin definir            → los runners de GitHub, como siempre
#   CI_RUNNER=<etiqueta>   → nuestra propia máquina con esa etiqueta
#
# Está así y no clavado a `self-hosted` porque una máquina propia es un punto
# único: el día que se apague o se quede sin red, borrar la variable devuelve
# todo a GitHub sin tocar código ni abrir un PR. Y ponerla afecta a los cuatro
# repositorios a la vez, que es como se quiere.
# Asigna a 50l3r como *assignee* de todo PR nuevo, para tenerlos localizados
# en `assignee:@me`. Es a proposito distinto de CODEOWNERS: ese fichero solo
# SOLICITA REVIEW (Nova y SOKI), que es otro rol.
name: auto-assign

on:
    pull_request_target:
        types: [opened, reopened]

# El job no hace checkout: solo llama a la API, asi que `pull_request_target`
# no llega a ejecutar nada del codigo de la rama del PR.
permissions:
    pull-requests: write

jobs:
    assign:
        runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
        steps:
            - name: asignar a 50l3r
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  PR: ${{ github.event.pull_request.number }}
              run: |
                  gh api -X POST "repos/$REPO/issues/$PR/assignees" \
                    -f "assignees[]=50l3r"
