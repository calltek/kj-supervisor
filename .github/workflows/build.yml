name: build-supervisor-image

on:
    push:
        branches: [main]
        tags: ['v*.*.*']
    pull_request:
        branches: [main]
    workflow_dispatch: {}

# We only need GHCR write on push; PRs build but don't push.
permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository_owner }}/kj-agent-supervisor

jobs:
    test:
        name: tests + typecheck + lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3'

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Pull protocol.ts (production endpoint)
              run: bun run pull-protocol

            - name: Typecheck
              run: bun x tsc --noEmit

            - name: Lint + format check
              run: bun x biome check src scripts

            - name: Unit tests
              run: bun test

    build:
        name: build + push supervisor image
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3'

            # Generate src/protocol.ts on the host. Dockerfile expects it
            # already present in the build context — it does not fetch
            # from inside the image.
            - name: Pull protocol.ts (production endpoint)
              run: bun run pull-protocol

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Tags:
            #   - latest  on main pushes
            #   - <sha>   always (so we can pin a deploy precisely)
            #   - vX.Y.Z  on version tag pushes (with major + major.minor aliases)
            - name: Compute image tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,format=short,prefix=
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
