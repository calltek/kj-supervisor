# Este repo es PÚBLICO, así que aquí no se usa `CI_RUNNER`: los minutos de
# Actions en repos públicos son gratis, y hacer que un PR de un fork ejecute
# código en nuestra máquina no compensa. Cada plataforma se construye nativa en
# runners de GitHub — `ubuntu-latest` para amd64 y `ubuntu-24.04-arm` para
# arm64 — y luego se unen las dos en un único manifiesto. Emulando arm64 con
# QEMU el mismo build tardaba 4,3 min; nativo, 0,6.
name: build-supervisor-image

on:
    push:
        branches: [main]
        tags: ['v*.*.*']
    pull_request:
        branches: [main]
    workflow_dispatch: {}

# We only need GHCR write on push; PRs build but don't push.
permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository_owner }}/kj-supervisor

jobs:
    test:
        name: tests + typecheck + lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3'

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Pull protocol.ts (production endpoint)
              run: bun run pull-protocol

            - name: Typecheck
              run: bun x tsc --noEmit

            - name: Lint + format check
              run: bun x biome check src scripts

            - name: Unit tests
              run: bun test

    # One job per platform, each on its own native machine. Nothing is tagged
    # here: each job pushes an untagged image by digest and hands the digest to
    # the merge job, which is what stitches both into one multi-arch tag.
    build:
        name: build supervisor (${{ matrix.platform }})
        needs: test
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v5

            # linux/amd64 -> linux-amd64, so it can be used in cache scopes and
            # artifact names (a slash breaks both).
            - name: Platform as a safe name
              run: |
                  platform=${{ matrix.platform }}
                  echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3'

            # Generate src/protocol.ts on the host. Dockerfile expects it
            # already present in the build context — it does not fetch
            # from inside the image.
            - name: Pull protocol.ts (production endpoint)
              run: bun run pull-protocol

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Labels for this image
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

            - name: Build by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: ${{ matrix.platform }}
                  labels: ${{ steps.meta.outputs.labels }}
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
                  cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
                  cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

            # The digest travels to the merge job as an empty file named after
            # it — nothing is downloaded twice, the layers are already in GHCR.
            - name: Export digest
              if: github.event_name != 'pull_request'
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ env.PLATFORM_PAIR }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    # This is where the tags are actually created: one manifest list pointing at
    # both per-platform digests.
    #
    # Tags:
    #   - latest  on main pushes
    #   - <sha>   always (so we can pin a deploy precisely)
    #   - vX.Y.Z  on version tag pushes (with major + major.minor aliases)
    merge:
        name: publish manifest
        needs: build
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Compute image tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,format=short,prefix=
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}

            # Los tags salen del output multilínea de metadata-action y se
            # convierten en `-t` a mano: nada de jq sobre
            # DOCKER_METADATA_OUTPUT_JSON, que además de ser una dependencia
            # más en el runner es fácil de escribir mal — un filtro que no
            # casa devuelve vacío, el `$(...)` se lo traga y el manifiesto se
            # publicaría SIN un solo tag.
            - name: Create manifest list and push
              working-directory: /tmp/digests
              env:
                  TAGS: ${{ steps.meta.outputs.tags }}
              run: |
                  set -euo pipefail
                  args=""
                  while IFS= read -r tag; do
                      [ -n "$tag" ] && args="$args -t $tag"
                  done <<< "$TAGS"
                  [ -n "$args" ] || { echo "::error::metadata-action no ha dado ningún tag"; exit 1; }
                  # shellcheck disable=SC2086
                  docker buildx imagetools create $args \
                      $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

            - name: Inspect
              run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
